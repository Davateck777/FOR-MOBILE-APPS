name: BookKeeper — Android Build

# Aim: Build_App -> Package_App -> Deliver_APK_FILE
# Runs entirely on this GitHub repo's Actions runners (no external build
# service). Produces a downloadable APK on every run, and can optionally
# publish a GitHub Release when a version tag is pushed or when triggered
# manually with "create_release: true".

on:
  push:
    branches: ['**']
    paths:
      - 'BookKeeper/**'
      - '.github/workflows/bookkeeper-android-build.yml'
    tags:
      - 'bookkeeper-v*.*.*'
  pull_request:
    paths:
      - 'BookKeeper/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK variant to build'
        type: choice
        options: [debug, release]
        default: debug
      create_release:
        description: 'Attach the APK to a new GitHub Release'
        type: boolean
        default: false

defaults:
  run:
    working-directory: BookKeeper

jobs:
  build:
    name: Build & package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: BookKeeper/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('BookKeeper/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Determine build variant
        id: variant
        run: |
          build_type="${{ github.event.inputs.build_type }}"
          if [ -z "$build_type" ]; then build_type="debug"; fi
          echo "type=$build_type" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (if configured)
        id: keystore
        if: steps.variant.outputs.type == 'release'
        working-directory: BookKeeper/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found — falling back to an unsigned debug APK."
          fi

      - name: Build debug APK
        if: steps.variant.outputs.type == 'debug' || steps.keystore.outputs.available != 'true'
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed)
        if: steps.variant.outputs.type == 'release' && steps.keystore.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Locate built APK
        id: apk
        run: |
          apk_path=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-${{ steps.variant.outputs.type }}-apk
          path: BookKeeper/${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/bookkeeper-v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: BookKeeper/${{ steps.apk.outputs.path }}
          generate_release_notes: true
